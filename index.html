<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Car Park Occupancy</title>
        <style>
            * {{ box-sizing: border-box; margin: 0; padding: 0; }}
            body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                   background: #111; color: #eee; display: flex; justify-content: center;
                   align-items: center; min-height: 100vh; }}
            .card {{ background: #1e1e1e; border-radius: 16px; padding: 2.5rem 3rem;
                     max-width: 480px; width: 90%; text-align: center; box-shadow: 0 8px 32px #0006; }}
            .status {{ display: inline-block; padding: 0.4em 1.2em; border-radius: 99px;
                       font-weight: 700; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; }}
            .status.quiet   {{ background: #14532d; color: #86efac; }}
            .status.moderate{{ background: #713f12; color: #fde047; }}
            .status.busy    {{ background: #7f1d1d; color: #fca5a5; }}
            .status.no_data {{ background: #374151; color: #9ca3af; }}
            h1 {{ font-size: 1.1rem; font-weight: 400; color: #9ca3af; margin: 1.2rem 0 0.4rem; }}
            .count {{ font-size: 4rem; font-weight: 800; }}
            .sub {{ font-size: 0.9rem; color: #6b7280; margin-bottom: 1.2rem; }}
            .bar-track {{ background: #333; border-radius: 8px; height: 12px; margin: 1rem 0; overflow: hidden; }}
            .bar-fill {{ height: 100%; border-radius: 8px; transition: width 0.5s; }}
            .bar-fill.quiet    {{ background: #22c55e; }}
            .bar-fill.moderate {{ background: #eab308; }}
            .bar-fill.busy     {{ background: #ef4444; }}
            .meta {{ font-size: 0.82rem; color: #6b7280; margin-top: 1.2rem; }}
            button {{ margin-top: 1.4rem; padding: 0.7rem 1.8rem; border: none; border-radius: 8px;
                      background: #3b82f6; color: #fff; font-size: 0.95rem; font-weight: 600;
                      cursor: pointer; transition: background 0.2s; }}
            button:hover {{ background: #2563eb; }}
            button:disabled {{ opacity: 0.5; cursor: not-allowed; }}
            .error {{ color: #f87171; margin-top: 0.5rem; font-size: 0.85rem; }}
            .snapshot {{ margin-top: 1.5rem; }}
            .snapshot img {{ width: 100%; border-radius: 10px; border: 2px solid #333; }}
            .snapshot .placeholder {{ color: #4b5563; font-size: 0.85rem; }}
        </style>
    </head>
    <body>
        <div class="card">
            <div id="status" class="status no_data">no data</div>
            <h1>cars detected in car park</h1>
            <div class="count" id="count">--</div>
            <div class="sub">of {max_spaces} spaces</div>
            <div class="bar-track">
                <div id="bar" class="bar-fill quiet" style="width: 0%"></div>
            </div>
            <div class="meta" id="meta">no sample yet</div>
            <div class="snapshot" id="snapshot">
                <div class="placeholder">no image yet</div>
            </div>
            <button id="btn" onclick="sampleNow()">Sample Now</button>
            <div class="error" id="err"></div>
        </div>

        <script>
            const statusEl = document.getElementById('status');
            const countEl  = document.getElementById('count');
            const barEl    = document.getElementById('bar');
            const metaEl   = document.getElementById('meta');
            const btnEl    = document.getElementById('btn');
            const errEl    = document.getElementById('err');
            const snapEl   = document.getElementById('snapshot');

            async function refresh() {{
              try {{
                const r = await fetch('/carpark');
                const d = await r.json();
                const pct = Math.round(d.occupancy * 100);
                statusEl.textContent = d.status.replace('_', ' ');
                statusEl.className = 'status ' + d.status;
                countEl.textContent = d.car_count % 1 ? d.car_count.toFixed(1) : d.car_count;
                barEl.style.width = pct + '%';
                barEl.className = d.status === 'no_data' ? 'bar-fill quiet' : 'bar-fill ' + d.status;
                metaEl.textContent = d.sampled_at
                  ? 'Last sampled ' + new Date(d.sampled_at).toLocaleString()
                  : 'no sample yet';
                if (d.image_url) {{
                  snapEl.innerHTML = '<img src="' + d.image_url + '" alt="Annotated car-park image" />';
                }} else {{
                  snapEl.innerHTML = '<div class="placeholder">no image yet</div>';
                }}
                errEl.textContent = '';
                document.title = (d.status === 'no_data' ? '' : pct + '% \u2014 ') + 'Car Park';
              }} catch (e) {{
                errEl.textContent = 'Failed to fetch data: ' + e.message;
              }}
            }}

            async function sampleNow() {{
              btnEl.disabled = true;
              btnEl.textContent = 'Sampling\u2026';
              errEl.textContent = '';
              try {{
                await fetch('/carpark/sample-now', {{ method: 'POST' }});
                setTimeout(refresh, 8000);
                setTimeout(refresh, 15000);
              }} catch (e) {{
                errEl.textContent = 'Trigger failed: ' + e.message;
              }}
              setTimeout(() => {{ btnEl.disabled = false; btnEl.textContent = 'Sample Now'; }}, 12000);
            }}

            refresh();
            setInterval(refresh, 30_000);
        </script>
    </body>
</html>
